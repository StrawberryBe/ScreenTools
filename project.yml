name: ScreenTools
options:
  bundleIdPrefix: com.local.screentools
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    from: "0.2.1"

targets:
  ScreenTools:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: ScreenTools
        CFBundleDisplayName: Screen Tools
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        NSScreenCaptureUsageDescription: "Screen Tools needs to capture the screen to power the magnifier / looking glass."
    entitlements:
      path: Support/ScreenTools.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - package: HotKey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.screentools.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "ScreenTools Local Signing"
        OTHER_CODE_SIGN_FLAGS: "--keychain /Users/bkrug/ScreenTools/signing/ScreenToolsSigning.keychain-db"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        SWIFT_VERSION: "5.0"
        COMBINE_HIDPI_IMAGES: true
